name: Monitor OceanBase repos

on:
  schedule:
    # GitHub 的 cron 是 UTC；每 15 分钟跑一次（实际可能延迟几分钟）
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/monitor.mjs
      - name: Commit snapshot
        id: commit
        run: |
          git config user.name "obwatch-bot"
          git config user.email "obwatch-bot@users.noreply.github.com"
          git add data.json state.json
          if git diff --quiet --cached; then
            echo "no changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "snapshot $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # 关键：用 GITHUB_TOKEN 推的 commit 不会触发别的 workflow，
      # 所以这里必须显式派发一次 Pages 部署。
      - name: Trigger Pages deploy
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" \
            -d '{"ref":"main"}'
