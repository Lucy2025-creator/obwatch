<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>OceanBase 2026 · 仓库监控</title>
<style>
  :root{
    --bg:#0b0f16; --panel:#121926; --panel2:#0f1622; --line:#223049;
    --text:#e6edf7; --muted:#8b9bb4; --accent:#4da3ff; --ok:#3ecf8e;
    --warn:#ffb020; --danger:#ff6b6b; --chip:#1a2740;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 15% -10%,#14233a 0%,var(--bg) 55%);
    color:var(--text);font:14px/1.6 "Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  header{position:sticky;top:0;z-index:5;background:rgba(11,15,22,.86);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding:14px 22px;display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  .brand{font-size:17px;font-weight:650;letter-spacing:.3px;display:flex;gap:9px;align-items:center}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
  .brand .dot.idle{background:var(--muted);box-shadow:none}
  .brand .dot.busy{background:var(--warn);box-shadow:0 0 10px var(--warn);animation:pulse 1s infinite}
  @keyframes pulse{50%{opacity:.35}}
  .meta{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin-left:auto;align-items:center}
  .meta b{color:var(--text);font-weight:600}
  .btn{background:#1a2740;border:1px solid #2a3d5c;color:var(--text);padding:7px 13px;border-radius:9px;
    cursor:pointer;font-size:13px;transition:.15s}
  .btn:hover{border-color:var(--accent);color:#fff}
  .btn.primary{background:linear-gradient(180deg,#2f7fe0,#2367bd);border-color:#3f8ce8}
  .btn:disabled{opacity:.5;cursor:default}
  main{max-width:1180px;margin:0 auto;padding:22px}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:26px 0 12px;font-weight:600}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:12px}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
    border-radius:14px;padding:14px 15px}
  .card .name{font-weight:650;font-size:14.5px;display:flex;justify-content:space-between;gap:8px}
  .card .sub{color:var(--muted);font-size:12px;margin-top:2px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{background:var(--chip);border:1px solid #26385a;border-radius:8px;padding:3px 8px;font-size:12px;
    display:inline-flex;gap:6px;align-items:center;color:#cfe0f7}
  .chip code{font-family:ui-monospace,Consolas,monospace;color:var(--muted);font-size:11px}
  .chip:hover{border-color:var(--accent);text-decoration:none}
  .empty{color:var(--muted);font-size:13px;padding:14px;border:1px dashed var(--line);border-radius:12px}
  .ev{display:flex;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;
    background:var(--panel);margin-bottom:8px;align-items:flex-start}
  .ev.strong{border-color:#5a3c12;background:linear-gradient(180deg,#1e170b,#141019)}
  .tag{font-size:11px;padding:2px 8px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
  .b-new{background:#0e2b46;color:#7cc4ff;border-color:#1b4b74}
  .b-upd{background:#132a22;color:#7ee2b0;border-color:#1d5340}
  .b-del{background:#2c1315;color:#ff9b9b;border-color:#5b2427}
  .b-repo{background:#221a3f;color:#bda6ff;border-color:#3b2f68}
  .b-user{background:#2a1e12;color:#ffc98a;border-color:#553d24}
  .b-tag{background:#1b2634;color:#a9c1dc;border-color:#2b3d54}
  .ev .body{flex:1;min-width:0}
  .ev .title{font-weight:600;overflow-wrap:anywhere}
  .ev .meta2{color:var(--muted);font-size:12px;margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
  .strong-tag{background:#3a2607;border:1px solid #7a4d0c;color:#ffc46b;font-size:11px;padding:2px 8px;border-radius:999px}
  .clone-path{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:#9fd3b0;overflow-wrap:anywhere}
  table{width:100%;border-collapse:collapse;font-size:13px}
  td{padding:8px 10px;border-bottom:1px solid #1b2637;vertical-align:top}
  td:first-child{color:var(--muted);white-space:nowrap;width:120px}
  .quota{height:6px;background:#182235;border-radius:99px;overflow:hidden;width:120px;display:inline-block;vertical-align:middle}
  .quota i{display:block;height:100%;background:linear-gradient(90deg,#2f7fe0,#54c7ff)}
  footer{color:var(--muted);font-size:12px;text-align:center;padding:26px}
  .note{background:#132033;border-bottom:1px solid var(--line);color:#9fc2ea;font-size:12.5px;
    padding:7px 22px;text-align:center;letter-spacing:.02em}
  .note b{color:#d7e7fb}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:2px 0 8px}
  .live{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot" id="dot"></span>OceanBase 2026 · 仓库监控</div>
  <div class="toolbar">
    <button class="btn primary" id="checkBtn">立即检查</button>
    <button class="btn" id="clonesBtn">打开 clones 文件夹</button>
  </div>
  <div class="meta">
    <span>上次 <b id="last">—</b></span>
    <span>下轮 <b id="next">—</b></span>
    <span>配额 <span class="quota"><i id="qbar" style="width:0%"></i></span> <b id="qtext">—</b></span>
    <span>代理 <b id="proxy">—</b></span>
    <span id="gitWrap">Git <b id="git">—</b></span>
  </div>
</header>
<div class="note" id="modeNote" style="display:none"></div>

<main>
  <section>
    <h2>关注仓库 · 比赛分支</h2>
    <div class="cards" id="repos"></div>
  </section>

  <section>
    <h2>动态</h2>
    <div id="events"></div>
  </section>

  <section>
    <h2>已自动 clone</h2>
    <div id="clones"></div>
  </section>

  <section>
    <h2>监控对象</h2>
    <div class="card"><table id="watch"></table></div>
  </section>
</main>

<footer>
  本地看板 · 数据来自 data/state.json 与内存状态 · 页面每 5 秒自动刷新
</footer>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KIND = {
  branch_new: ['新分支', 'b-new'],
  branch_update: ['分支更新', 'b-upd'],
  branch_deleted: ['分支删除', 'b-del'],
  repo_new: ['新仓库', 'b-repo'],
  user_repo_new: ['账号新仓库', 'b-user'],
  tag_new: ['新标签', 'b-tag'],
};
const pad = (n) => String(n).padStart(2, '0');
function fmt(ts) {
  if (!ts) return '—';
  const d = new Date(ts);
  return `${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
function ago(ts) {
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return s + ' 秒前';
  if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
  if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
  return Math.floor(s / 86400) + ' 天前';
}
let latest = null;
let countdownTimer = null;
let MODE = 'live';

function renderRepos(repos) {
  const box = $('#repos');
  if (!repos.length) { box.innerHTML = '<div class="empty">config.json 里还没有配置仓库</div>'; return; }
  box.innerHTML = repos.map((r) => {
    const chips = r.branches.length
      ? r.branches.map((b) => `<a class="chip" href="${esc(b.url)}" target="_blank" rel="noreferrer">${esc(b.name)} <code>${esc(b.sha.slice(0, 7))}</code></a>`).join('')
      : '<span class="chip" style="color:#8b9bb4">暂无比赛相关分支</span>';
    return `<div class="card">
      <div class="name"><a href="${esc(r.url)}" target="_blank" rel="noreferrer">${esc(r.name)}</a><span class="sub">${r.branchCount} 分支</span></div>
      <div class="sub">${r.tagCount} 个标签</div>
      <div class="chips">${chips}</div>
    </div>`;
  }).join('');
}

function renderEvents(events) {
  const box = $('#events');
  if (!events.length) {
    box.innerHTML = '<div class="empty">还没有变动记录。有新分支、新仓库或新标签时会出现在这里；赛题级证据会标成橙色。</div>';
    return;
  }
  box.innerHTML = events.map((e) => {
    const [label, cls] = KIND[e.kind] || [e.kind, 'b-tag'];
    const strong = e.strong ? '<span class="strong-tag">疑似新赛题</span>' : '';
    const sha = e.sha ? `<span>${esc(String(e.sha).slice(0, 8))}</span>` : '';
    const branch = e.branch ? `<span>${esc(e.branch)}</span>` : '';
    const clone = e.clone && e.clone.ok ? `<div class="clone-path">已 clone → ${esc(e.clone.dir)}</div>` : '';
    return `<div class="ev ${e.strong ? 'strong' : ''}">
      <span class="tag ${cls}">${label}</span>
      <div class="body">
        <div class="title">${e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noreferrer">${esc(e.title)}</a>` : esc(e.title)} ${strong}</div>
        <div class="meta2"><span>${fmt(e.ts)}</span><span>${ago(e.ts)}</span><span>${esc(e.repo)}</span>${branch}${sha}</div>
        ${clone}
      </div>
    </div>`;
  }).join('');
}

function renderClones(clones) {
  const box = $('#clones');
  if (!clones.length) { box.innerHTML = '<div class="empty">还没有自动 clone。判定为强赛题证据时会自动拉下来。</div>'; return; }
  box.innerHTML = clones.map((c) => `<div class="card" style="margin-bottom:8px">
    <div class="name">${esc(c.key)}</div>
    <div class="clone-path">${esc(c.dir)}</div>
    <div class="sub">${fmt(c.at)}${c.sha ? ' · ' + esc(String(c.sha).slice(0, 8)) : ''}</div>
  </div>`).join('');
}

function renderWatch(s) {
  $('#watch').innerHTML = `
    <tr><td>仓库</td><td>${s.watch.repos.map(esc).join('<br>')}</td></tr>
    <tr><td>组织</td><td>${s.watch.orgs.map(esc).join('<br>') || '—'}</td></tr>
    <tr><td>开发者账号</td><td>${s.watch.users.map(esc).join('<br>') || '—'}</td></tr>
    <tr><td>Token</td><td>${s.hasToken ? '已配置' : '未配置（未认证 60 次/小时）'}</td></tr>`;
}

function renderStats(s) {
  latest = s;
  $('#last').textContent = s.lastCheckAt ? fmt(s.lastCheckAt) : '等待首轮';
  $('#proxy').textContent = s.proxy || (MODE === 'static' ? '静态快照' : '直连');
  $('#git').textContent = s.git === true ? '已安装' : s.git === false ? '未安装' : MODE === 'static' ? '—' : '检测中';
  const q = s.quota || {};
  if (q.remaining == null) {
    $('#qtext').textContent = MODE === 'static' ? '—' : '未知';
  } else {
    const limit = q.limit || (s.hasToken ? 5000 : 60);
    $('#qtext').textContent = `${q.remaining}/${limit}`;
    $('#qbar').style.width = Math.max(2, Math.round((q.remaining / limit) * 100)) + '%';
  }
  const dot = $('#dot');
  dot.className = 'dot' + (s.checking ? ' busy' : s.ok ? '' : ' idle');
  $('#checkBtn').disabled = !!s.checking;
  $('#checkBtn').textContent = s.checking ? '检查中…' : '立即检查';
  $('#next').dataset.at = s.nextCheckAt || '';
  updateCountdown();
}

function applyMode(s) {
  if (MODE !== 'static') return;
  $('#checkBtn').style.display = 'none';
  $('#clonesBtn').style.display = 'none';
  const note = $('#modeNote');
  note.style.display = 'block';
  note.innerHTML = `只读快照 · 由 GitHub Actions 定时更新 · 快照生成于 <b>${s.generatedAt ? fmt(s.generatedAt) : '—'}</b>`;
}

function updateCountdown() {
  const at = Number($('#next').dataset.at || 0);
  if (!at) { $('#next').textContent = '—'; return; }
  const s = Math.max(0, Math.round((at - Date.now()) / 1000));
  const m = Math.floor(s / 60), ss = s % 60;
  $('#next').textContent = s > 0 ? `${m}:${pad(ss)} 后` : '即将';
}

async function loadState() {
  try {
    const r = await fetch('api/state', { cache: 'no-store' });
    const ct = r.headers.get('content-type') || '';
    if (!r.ok || !ct.includes('json')) throw new Error('no live api');
    return await r.json();
  } catch {
    MODE = 'static';
    const r = await fetch('./data.json', { cache: 'no-store' });
    if (!r.ok) throw new Error('no snapshot');
    return await r.json();
  }
}

async function refresh() {
  try {
    const s = await loadState();
    if (!s.ok) throw new Error('bad response');
    applyMode(s);
    renderStats(s);
    renderRepos(s.repos || []);
    renderEvents(s.events || []);
    renderClones(s.clones || []);
    renderWatch(s);
  } catch (e) {
    $('#dot').className = 'dot idle';
    $('#last').textContent = MODE === 'static' ? '还没有快照' : '连不上本地服务';
  }
}

$('#checkBtn').addEventListener('click', async () => {
  $('#checkBtn').disabled = true;
  try { await fetch('/api/check', { method: 'POST' }); } catch {}
  setTimeout(refresh, 800);
});

$('#clonesBtn').addEventListener('click', async () => {
  try { await fetch('/api/reveal', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ dir: 'clones' }) }); } catch {}
});

refresh();
setInterval(refresh, 5000);
if (!countdownTimer) countdownTimer = setInterval(updateCountdown, 1000);
</script>
</body>
</html>
